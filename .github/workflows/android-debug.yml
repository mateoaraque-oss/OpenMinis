name: Android Debug APK

# Builds the OpenMinis Android app (arm64-v8a) in the cloud and publishes the
# debug APK as an artifact. Designed for a fork: no secrets required, debug
# signing is generated by Gradle.
#
# Why the cloud: the app needs JDK 17 + SDK 36 + NDK r28 + Go/gomobile, and
# Gradle wants 6+ GB of RAM. A 4 GB laptop OOMs the Kotlin compiler.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          echo "--- before ---"
          df -h /
          # The runner image preinstalls several toolchains we do not use.
          # Removing them buys ~8 GB, which the NDK + Go builds need.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          echo "--- after ---"
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Locate the preinstalled Android SDK
        run: |
          # The runner image ships a full SDK. android-actions/setup-android@v3
          # is deliberately NOT used: it runs `sdkmanager tools`, a package
          # Google removed, and the whole job dies before compiling anything.
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager at $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"
          echo "ANDROID_NDK_27=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "--- ndk r28 (for the proot / rclone native build) ---"
          NDK_PKG="$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;28\.[0-9.]+' | sort -V | tail -1)"
          echo "picked: $NDK_PKG"
          sdkmanager --install "$NDK_PKG"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_PKG#ndk;}" >> "$GITHUB_ENV"
          echo "--- installed ---"
          sdkmanager --list_installed || true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Init gomobile
        run: gomobile init

      - name: Build-time customization
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Build PRoot (assets + loaders)
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh
          ls -lh src/android/app/src/main/assets/proot-aarch64
          ls -lh src/android/app/src/main/jniLibs/arm64-v8a/

      - name: Prepare Alpine rootfs
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh
          ls -lh src/android/app/src/main/assets/alpine-minirootfs.tar.gz

      - name: Bundle llama.cpp server (Android arm64)
        run: |
          set -euo pipefail
          # [T-orion-local-model] Official prebuilt Android binaries. Shipping
          # them in jniLibs (not assets) is what makes exec legal for a
          # targetSdk-35 app: the native lib dir is installed read-only.
          LLAMA_TAG=b12182
          ARCHIVE="llama-${LLAMA_TAG}-bin-android-arm64.tar.gz"
          curl -fL --retry 3 --retry-delay 5 \
            -o "/tmp/${ARCHIVE}" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${ARCHIVE}"
          mkdir -p /tmp/llama
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp/llama
          echo "--- archive layout ---"
          find /tmp/llama -maxdepth 3 -type f | head -n 40

          # The tarball's internal layout has changed between releases
          # (bin/ versus flat). Locate the binary instead of assuming it.
          SERVER=$(find /tmp/llama -type f -name llama-server | head -n 1)
          test -n "$SERVER"
          SRC=$(dirname "$SERVER")
          echo "using engine dir: $SRC"

          DST="src/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DST"

          # Copy every shared object the release ships, not a hand-written
          # list: a missing libc++_shared / libomp / ggml variant is a runtime
          # "library not found" long after CI went green.
          shopt -s nullglob
          bundled=()
          for so in "$SRC"/*.so; do
            base=$(basename "$so")
            cp "$so" "$DST/$base"
            bundled+=("$DST/$base")
          done
          shopt -u nullglob
          test "${#bundled[@]}" -gt 0

          # llama-server itself is a small stub; the body lives in
          # libllama-server-impl.so. Rename to lib*.so so AGP packages and the
          # installer extracts it. Copied last so it wins over any same-named
          # library from the loop above.
          cp "$SERVER" "$DST/libllama-server.so"
          bundled+=("$DST/libllama-server.so")

          echo "--- copied ---"
          printf '%s\n' "${bundled[@]}"

          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          for so in "${bundled[@]}"; do
            "$STRIP" --strip-unneeded "$so"
          done
          chmod +x "$DST/libllama-server.so"

          mkdir -p src/android/app/src/main/assets
          LICENSE_FILE=$(find /tmp/llama -type f -name LICENSE | head -n 1)
          test -n "$LICENSE_FILE"
          cp "$LICENSE_FILE" src/android/app/src/main/assets/llama.cpp-LICENSE.txt

          echo "--- bundled ---"
          ls -lh "$DST"/libllama-*.so "$DST"/libggml*.so
          du -sh "$DST"

      - name: Build rclone AAR
        run: |
          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          ls -lh src/android/app/libs/rclone.aar

      # [T-orion-stable-debug-key] AGP used to write ~/.android/debug.keystore
      # on the first build of a fresh runner, so every CI run signed with a
      # different key and `adb install -r` failed with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE — each update forced an uninstall,
      # which wiped chats and settings. The earlier `~/.android` cache turned
      # out to capture 362 bytes of metadata (AGP writes the keystore
      # elsewhere on the runner), so cache the keystore file itself and
      # generate it explicitly when the cache misses.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/orion-debug.keystore
          key: orion-debug-keystore-v2

      - name: Ensure stable debug keystore
        run: |
          KS="$HOME/.android/orion-debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias oriondebug -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Orion Debug, OU=Orion, O=Orion, L=NA, ST=NA, C=NA"
          fi
          echo "ORION_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS" -storepass android | tail -3

      # [T-orion-wake-word] openWakeWord models (Apache-2.0 code, models
      # CC BY-NC-SA 4.0). 3.7 MB total, fetched from the upstream v0.5.1
      # release instead of committing binaries. The detector refuses to start
      # with a clear log line if these are missing, so a network hiccup here
      # cannot produce a silently deaf build.
      - name: Fetch wake-word models
        run: |
          DEST=src/android/app/src/main/assets/wakeword
          mkdir -p "$DEST"
          BASE=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          for f in melspectrogram.tflite embedding_model.tflite hey_jarvis_v0.1.tflite; do
            curl -fsSL --retry 3 "$BASE/$f" -o "$DEST/$f"
          done
          ls -lh "$DEST"

      - name: Assemble debug APK
        working-directory: src/android
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Collect APK
        run: |
          mkdir -p out
          find src/android/app/build/outputs/apk -name '*.apk' -print
          cp src/android/app/build/outputs/apk/debug/*.apk "out/minis-local-debug.apk"
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-local-debug-apk
          path: out/minis-local-debug.apk
          if-no-files-found: error
          retention-days: 30
